<svg viewBox="0 0 1500 800" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1500" height="800" fill="#ffffff"/>

  <!-- Title -->
  <text x="750" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a2e">ERD — OEE Manufacturing Dashboard (Esquema Estrella)</text>

  <!-- ============ LINEAS ============ -->
  <g>
    <rect x="40" y="60" width="180" height="90" fill="#2b6cb0" stroke="#1a365d" stroke-width="1.5"/>
    <text x="130" y="82" font-size="13" font-weight="bold" fill="white" text-anchor="middle">lineas</text>
    <line x1="40" y1="90" x2="220" y2="90" stroke="white" stroke-width="1"/>
    <rect x="40" y="90" width="180" height="60" fill="#ebf4ff" stroke="#1a365d" stroke-width="1"/>
    <text x="52" y="108" font-size="11" fill="#1a202c">PK id_linea</text>
    <text x="52" y="126" font-size="11" fill="#1a202c">nombre</text>
  </g>

  <!-- ============ MAQUINAS ============ -->
  <g>
    <rect x="40" y="260" width="220" height="130" fill="#2b6cb0" stroke="#1a365d" stroke-width="1.5"/>
    <text x="150" y="282" font-size="13" font-weight="bold" fill="white" text-anchor="middle">maquinas</text>
    <line x1="40" y1="290" x2="260" y2="290" stroke="white" stroke-width="1"/>
    <rect x="40" y="290" width="220" height="100" fill="#ebf4ff" stroke="#1a365d" stroke-width="1"/>
    <text x="52" y="308" font-size="11" fill="#1a202c">PK id_maquina</text>
    <text x="52" y="326" font-size="11" fill="#1a202c">FK id_linea</text>
    <text x="52" y="344" font-size="11" fill="#1a202c">nombre</text>
    <text x="52" y="362" font-size="11" fill="#1a202c">velocidad_ideal_ppm</text>
  </g>

  <!-- ============ TURNOS ============ -->
  <g>
    <rect x="1000" y="60" width="200" height="110" fill="#2b6cb0" stroke="#1a365d" stroke-width="1.5"/>
    <text x="1100" y="82" font-size="13" font-weight="bold" fill="white" text-anchor="middle">turnos</text>
    <line x1="1000" y1="90" x2="1200" y2="90" stroke="white" stroke-width="1"/>
    <rect x="1000" y="90" width="200" height="80" fill="#ebf4ff" stroke="#1a365d" stroke-width="1"/>
    <text x="1012" y="108" font-size="11" fill="#1a202c">PK id_turno</text>
    <text x="1012" y="126" font-size="11" fill="#1a202c">nombre</text>
    <text x="1012" y="144" font-size="11" fill="#1a202c">hora_inicio</text>
    <text x="1012" y="162" font-size="11" fill="#1a202c">hora_fin</text>
  </g>

  <!-- ============ CAUSAS_PARADA ============ -->
  <g>
    <rect x="1260" y="260" width="220" height="160" fill="#2b6cb0" stroke="#1a365d" stroke-width="1.5"/>
    <text x="1370" y="282" font-size="13" font-weight="bold" fill="white" text-anchor="middle">causas_parada</text>
    <line x1="1260" y1="290" x2="1480" y2="290" stroke="white" stroke-width="1"/>
    <rect x="1260" y="290" width="220" height="130" fill="#ebf4ff" stroke="#1a365d" stroke-width="1"/>
    <text x="1272" y="308" font-size="11" fill="#1a202c">PK id_causa</text>
    <text x="1272" y="326" font-size="11" fill="#1a202c">nombre</text>
    <text x="1272" y="344" font-size="11" fill="#1a202c">categoria</text>
    <text x="1272" y="362" font-size="11" fill="#1a202c">prob_relativa</text>
    <text x="1272" y="380" font-size="11" fill="#1a202c">duracion_media_min</text>
    <text x="1272" y="398" font-size="11" fill="#1a202c">duracion_sd_min</text>
  </g>

  <!-- ============ PRODUCCION_INTERVALOS ============ -->
  <g>
    <rect x="40" y="480" width="260" height="220" fill="#2f855a" stroke="#22543d" stroke-width="1.5"/>
    <text x="170" y="502" font-size="13" font-weight="bold" fill="white" text-anchor="middle">produccion_intervalos</text>
    <line x1="40" y1="510" x2="300" y2="510" stroke="white" stroke-width="1"/>
    <rect x="40" y="510" width="260" height="190" fill="#f0fff4" stroke="#22543d" stroke-width="1"/>
    <text x="52" y="528" font-size="11" fill="#1a202c">PK id_produccion</text>
    <text x="52" y="546" font-size="11" fill="#1a202c">FK id_maquina</text>
    <text x="52" y="564" font-size="11" fill="#1a202c">fecha</text>
    <text x="52" y="582" font-size="11" fill="#1a202c">FK id_turno</text>
    <text x="52" y="600" font-size="11" fill="#1a202c">minuto_inicio / minuto_fin</text>
    <text x="52" y="618" font-size="11" fill="#1a202c">piezas_totales</text>
    <text x="52" y="636" font-size="11" fill="#1a202c">piezas_buenas</text>
    <text x="52" y="654" font-size="11" fill="#1a202c">piezas_rechazadas</text>
  </g>

  <!-- ============ PARADAS ============ -->
  <g>
    <rect x="480" y="480" width="260" height="220" fill="#2f855a" stroke="#22543d" stroke-width="1.5"/>
    <text x="610" y="502" font-size="13" font-weight="bold" fill="white" text-anchor="middle">paradas</text>
    <line x1="480" y1="510" x2="740" y2="510" stroke="white" stroke-width="1"/>
    <rect x="480" y="510" width="260" height="190" fill="#f0fff4" stroke="#22543d" stroke-width="1"/>
    <text x="492" y="528" font-size="11" fill="#1a202c">PK id_parada</text>
    <text x="492" y="546" font-size="11" fill="#1a202c">FK id_maquina</text>
    <text x="492" y="564" font-size="11" fill="#1a202c">fecha</text>
    <text x="492" y="582" font-size="11" fill="#1a202c">FK id_turno</text>
    <text x="492" y="600" font-size="11" fill="#1a202c">FK id_causa</text>
    <text x="492" y="618" font-size="11" fill="#1a202c">minuto_inicio / minuto_fin</text>
    <text x="492" y="636" font-size="11" fill="#1a202c">duracion_min</text>
  </g>

  <!-- ============ OEE_TURNO (agregada) ============ -->
  <g>
    <rect x="960" y="480" width="300" height="290" fill="#c05621" stroke="#7b341e" stroke-width="1.5"/>
    <text x="1110" y="502" font-size="13" font-weight="bold" fill="white" text-anchor="middle">oee_turno  (agregada)</text>
    <line x1="960" y1="510" x2="1260" y2="510" stroke="white" stroke-width="1"/>
    <rect x="960" y="510" width="300" height="260" fill="#fffaf0" stroke="#7b341e" stroke-width="1"/>
    <text x="972" y="528" font-size="11" fill="#1a202c">PK,FK id_maquina</text>
    <text x="972" y="546" font-size="11" fill="#1a202c">PK    fecha</text>
    <text x="972" y="564" font-size="11" fill="#1a202c">PK,FK id_turno</text>
    <text x="972" y="582" font-size="11" fill="#1a202c">FK id_linea</text>
    <text x="972" y="600" font-size="11" fill="#1a202c">tiempo_planeado_min</text>
    <text x="972" y="618" font-size="11" fill="#1a202c">tiempo_operando_min</text>
    <text x="972" y="636" font-size="11" fill="#1a202c">tiempo_parada_min</text>
    <text x="972" y="654" font-size="11" fill="#1a202c">piezas_totales/buenas/rechazadas</text>
    <text x="972" y="672" font-size="11" fill="#1a202c">disponibilidad</text>
    <text x="972" y="690" font-size="11" fill="#1a202c">rendimiento</text>
    <text x="972" y="708" font-size="11" fill="#1a202c">calidad</text>
    <text x="972" y="726" font-size="11" font-weight="bold" fill="#7b341e">oee</text>
  </g>

  <!-- ============ RELACIONES (lineas solidas = FK directa) ============ -->
  <!-- lineas -> maquinas -->
  <path d="M 130 150 L 130 260" stroke="#2d3748" stroke-width="1.5" fill="none"/>
  <text x="136" y="215" font-size="10" fill="#2d3748">1:N</text>

  <!-- maquinas -> produccion_intervalos -->
  <path d="M 130 390 L 130 480" stroke="#2d3748" stroke-width="1.5" fill="none"/>
  <text x="136" y="440" font-size="10" fill="#2d3748">1:N</text>

  <!-- maquinas -> paradas -->
  <path d="M 260 340 C 400 340, 500 400, 550 480" stroke="#2d3748" stroke-width="1.5" fill="none"/>
  <text x="380" y="360" font-size="10" fill="#2d3748">1:N</text>

  <!-- turnos -> produccion_intervalos -->
  <path d="M 1000 130 C 500 200, 250 350, 200 480" stroke="#2d3748" stroke-width="1.5" fill="none"/>
  <text x="500" y="220" font-size="10" fill="#2d3748">1:N</text>

  <!-- turnos -> paradas -->
  <path d="M 1050 170 C 900 280, 750 400, 660 480" stroke="#2d3748" stroke-width="1.5" fill="none"/>
  <text x="880" y="300" font-size="10" fill="#2d3748">1:N</text>

  <!-- causas_parada -> paradas -->
  <path d="M 1260 340 C 1000 380, 850 420, 740 550" stroke="#2d3748" stroke-width="1.5" fill="none"/>
  <text x="1000" y="400" font-size="10" fill="#2d3748">1:N</text>

  <!-- Dashed: aggregated relationships into oee_turno -->
  <path d="M 260 350 C 600 380, 850 420, 960 550" stroke="#7b341e" stroke-width="1.5" stroke-dasharray="6,4" fill="none"/>
  <path d="M 220 105 C 700 120, 950 300, 1000 600" stroke="#7b341e" stroke-width="1.5" stroke-dasharray="6,4" fill="none"/>
  <path d="M 1100 170 C 1105 300, 1108 400, 1110 480" stroke="#7b341e" stroke-width="1.5" stroke-dasharray="6,4" fill="none"/>
  <text x="700" y="440" font-size="10" fill="#7b341e" font-style="italic">agregado desde produccion_intervalos + paradas</text>

  <!-- Legend -->
  <rect x="40" y="750" width="16" height="12" fill="#2b6cb0"/>
  <text x="62" y="760" font-size="11" fill="#1a202c">Dimensión</text>
  <rect x="180" y="750" width="16" height="12" fill="#2f855a"/>
  <text x="202" y="760" font-size="11" fill="#1a202c">Hecho (detalle/evento)</text>
  <rect x="380" y="750" width="16" height="12" fill="#c05621"/>
  <text x="402" y="760" font-size="11" fill="#1a202c">Hecho (agregado, usado por Grafana)</text>
</svg>
